name: Install Baggage Color Flow cover

on:
  push:
    branches: [master]
    paths:
      - 'tmp/baggage-cover/**'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check all chunks are present
        id: check
        shell: bash
        run: |
          count=$(find tmp/baggage-cover -maxdepth 1 -name 'part*.b64' 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Build official cover
        if: steps.check.outputs.count == '6'
        shell: bash
        run: |
          cat tmp/baggage-cover/part1.b64 tmp/baggage-cover/part2.b64 tmp/baggage-cover/part3.b64 tmp/baggage-cover/part4.b64 tmp/baggage-cover/part5.b64 tmp/baggage-cover/part6.b64 > /tmp/baggage-cover.b64
          base64 --decode /tmp/baggage-cover.b64 > /tmp/baggage-cover.webp
          mkdir -p images/baggage-color-flow promotion-assets/baggage-color-flow
          cp /tmp/baggage-cover.webp images/baggage-color-flow/cover-landscape.webp
          cp /tmp/baggage-cover.webp promotion-assets/baggage-color-flow/cover.webp
      - name: Commit generated cover
        if: steps.check.outputs.count == '6'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/baggage-color-flow/cover-landscape.webp promotion-assets/baggage-color-flow/cover.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add official Baggage Color Flow cover artwork"
          git push
