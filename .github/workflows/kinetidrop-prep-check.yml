name: KinetiDrop candidate preparer tests

on:
  pull_request:
    paths:
      - "tools/kinetidrop-distribution/**"
      - "tests/kinetidrop/**"
      - ".github/workflows/kinetidrop-prep-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q tools/kinetidrop-distribution/prepare.py
      - run: python -m unittest discover -s tests/kinetidrop -p 'test_*.py' -v
