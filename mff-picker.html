<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>My Finance Forecast - Google Picker</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; font-family: Arial, sans-serif; }
    #status { padding: 18px; color: #263238; font-size: 15px; }
  </style>
  <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
  <div id="status">Apertura Google Drive…</div>
  <script>
    (function () {
      const API_KEY = 'AIzaSyDIxklGpHLLmR2Y7Pw3P8umRrobDZ4HM3k';
      const SHEETS_MIME = 'application/vnd.google-apps.spreadsheet';
      let credentials = null;
      let pickerStarted = false;

      function send(type, payload) {
        if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: type, payload: payload || null }));
        }
      }

      function pickerCallback(data) {
        if (!window.google || !google.picker) return;
        if (data.action === google.picker.Action.PICKED) {
          const doc = data.docs && data.docs[0];
          if (doc) {
            send('picked', {
              id: doc.id,
              name: doc.name || 'Google Sheet',
              mimeType: doc.mimeType || SHEETS_MIME
            });
          }
        } else if (data.action === google.picker.Action.CANCEL) {
          send('cancel');
        }
      }

      function createPicker() {
        if (pickerStarted || !credentials || !window.google || !google.picker) return;
        pickerStarted = true;
        try {
          const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS);
          const builder = new google.picker.PickerBuilder()
            .addView(view)
            .setOAuthToken(credentials.accessToken)
            .setDeveloperKey(API_KEY)
            .setAppId(credentials.projectNumber)
            .setLocale('it')
            .setCallback(pickerCallback);

          if (builder.setOrigin) {
            builder.setOrigin(window.location.protocol + '//' + window.location.host);
          }
          if (builder.setSize) {
            builder.setSize(Math.max(320, window.innerWidth), Math.max(500, window.innerHeight));
          }

          builder.build().setVisible(true);
          document.getElementById('status').textContent = '';
        } catch (error) {
          pickerStarted = false;
          send('error', { message: error && error.message ? error.message : String(error) });
        }
      }

      function boot() {
        if (!credentials) return;
        if (!window.gapi) {
          setTimeout(boot, 100);
          return;
        }
        gapi.load('picker', { callback: createPicker });
      }

      window.MFFPicker = {
        start: function (accessToken, projectNumber) {
          credentials = { accessToken: accessToken, projectNumber: String(projectNumber) };
          pickerStarted = false;
          boot();
        }
      };
    })();
  </script>
</body>
</html>
